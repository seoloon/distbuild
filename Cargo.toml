[workspace]
resolver = "2"
members = [
    "crates/discovery",
    "crates/protocol",
    "crates/executor",
    "crates/artifacts",
    "crates/diagnostics",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
